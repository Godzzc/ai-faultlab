server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: faultlab-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:faultlab}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

faultlab:
  mq-backlog:
    exchange: ${MQ_BACKLOG_EXCHANGE:faultlab.mq.backlog.exchange}
    queue: ${MQ_BACKLOG_QUEUE:faultlab.mq.backlog.queue}
    routing-key: ${MQ_BACKLOG_ROUTING_KEY:faultlab.mq.backlog.order}
